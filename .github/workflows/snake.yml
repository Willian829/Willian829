name: Generate snake animation

on:
  # runs every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # runs every time you push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate the snake SVGs from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#9644CD&color_dots=#ebedf0,#e4ccf8,#c79cf2,#a066e3,#7432c4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d7a8ff&color_dots=#161b22,#3b1f5e,#5b2b8f,#8040c8,#b06cf5

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
